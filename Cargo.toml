[package]
authors = ["Source 🖋️ Open 👐🏻 <Source/Open@Editor.Land>"]
autobenches = false
autobins = false
autoexamples = false
autotests = false
default-run = "Air"
description = "Air 🪁 - The Native Background Daemon for Land"
edition = "2024"
license-file = "LICENSE"
name = "Air"
publish = false
version = "0.1.0"

[lib]
name = "Air"
path = "Source/Library.rs"

[[bin]]
ame = "Air"
path = "Source/Binary.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
tonic = { version = "0.11", features = ["transport"] }
prost = "0.12"
tonic-prost = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
thiserror = "1.0"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
tokio-stream = { version = "0.1", features = ["fs"] }
walkdir = "2.5"
ignore = "0.4"
sha2 = "0.10"
md5 = "0.8.0"
base64 = "0.22.1"
ring = "0.17"
rand = "0.9.2"

# For configuration management
config = "0.15.19"
dirs = "6.0.0"

# For IPC communication with Mountain
tokio-serial = { version = "0.9", features = ["full"] }
tokio-pipe = "0.2"

# For process management
sysinfo = "0.30"

# For file watching
notify = "6.1"

# For performance monitoring
systemstat = "0.2"

[build-dependencies]
tonic-build = "0.11"
prost-build = "0.12"

[features]
default = ["full-services"]
full-services = ["authentication", "updates", "downloader", "indexing"]
authentication = []
updates = []
downloader = []
indexing = []

[package.metadata.docs.rs]
all-features = true
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]
default-target = "x86_64-unknown-linux-gnu"
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin", 
    "aarch64-apple-darwin",
]

[workspace]
members = ["Source"]
