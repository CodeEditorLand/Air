[package]
authors = ["Source 🖋️ Open 👐🏻 <Source/Open@Editor.Land>"]
autobenches = false
autobins = false
autoexamples = false
autotests = false
default-run = "Air"
description = "Air 🪁 - The Native Background Daemon for Land"
edition = "2024"
license-file = "LICENSE"
name = "Air"
publish = false
version = "0.1.0"

[lib]
name = "AirLibrary"
path = "Source/Library.rs"

[[bin]]
name = "Air"
path = "Source/Binary.rs"

[dependencies]
tokio = { workspace = true }
tonic = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }
Mist = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v4", "serde"] }
walkdir = { workspace = true }
ignore = { workspace = true }
sha2 = { workspace = true }
md5 = { workspace = true }
base64 = { workspace = true }
crc32fast = { workspace = true }
ring = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }
subtle = { workspace = true }
tokio-stream = { workspace = true }
bytes = { workspace = true, features = ["serde"] }
config = { workspace = true }
dirs = { workspace = true }
toml = { workspace = true }
sysinfo = { workspace = true }
notify = { workspace = true }
systemstat = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = [
	"json",
	"env-filter",
	"fmt",
	"time",
	"ansi",
] }
tracing-appender = { workspace = true }
tonic-prost = { workspace = true }
prost = { workspace = true }
flate2 = { workspace = true }
hostname = { workspace = true }
hex = { workspace = true }
json5 = { workspace = true }
portpicker = { workspace = true }
prun = { workspace = true }
regex = { workspace = true }
tempfile = { workspace = true }
tokio-tungstenite = { workspace = true }
url = { workspace = true }
zip = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
tokio-rustls = { workspace = true }
rustls-native-certs = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Storage_FileSystem"] }

[build-dependencies]
tonic-build = { workspace = true }
tonic-prost-build = { workspace = true }
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true }

[features]
default = ["full-services", "mtls"]
full-services = ["authentication", "updates", "downloader", "indexing"]
authentication = []
updates = []
downloader = []
indexing = []
mtls = []
appimage = []
deb = []
rpm = []

[package.metadata.docs.rs]
all-features = true
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]
default-target = "x86_64-unknown-linux-gnu"
targets = [
	"x86_64-unknown-linux-gnu",
	"x86_64-apple-darwin",
	"aarch64-apple-darwin",
]

[dev-dependencies]
# Async testing utilities
tokio-test = "0.4"
# Test utilities
futures = { workspace = true }
