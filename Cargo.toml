[package]
authors = ["Source 🖋️ Open 👐🏻 <Source/Open@Editor.Land>"]
autobenches = false
autobins = false
autoexamples = false
autotests = false
default-run = "Air"
description = "Air 🪁 - The Native Background Daemon for Land"
edition = "2024"
license-file = "LICENSE"
name = "Air"
publish = false
version = "0.1.0"

[lib]
name = "AirLibrary"
path = "Source/Library.rs"

[[bin]]
name = "Air"
path = "Source/Binary.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v4", "serde"] }
walkdir = "2.5.0"
ignore = "0.4.25"
sha2 = "0.10.9"
md5 = "0.8.0"
base64 = "0.22.1"
crc32fast = "1.5.0"
ring = "0.17.14"
rand = "0.9.2"
zeroize = "1.8.2"
subtle = "2.6.1"
tokio-stream = { workspace = true }
bytes = { version = "1.11.0", features = ["serde"] }

# For configuration management
config = { workspace = true }
dirs = { workspace = true }
toml = { workspace = true }

# For process management
sysinfo = "0.38.0"

# For file watching
notify = "8.2.0"

# For performance monitoring
systemstat = "0.2.5"

# Observability - Metrics
prometheus-client = "0.24.0"

# Observability - Tracing and Structured Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = [
	"json",
	"env-filter",
	"fmt",
	"time",
	"ansi",
] }
tracing-appender = "0.2.4"

# gRPC dependencies
tonic = { workspace = true }
tonic-prost = { workspace = true }
prost = { workspace = true }

# Additional dependencies
flate2 = "1.1.8"
hostname = "0.4.2"
hex = "0.4.3"
json5 = "1.3.0"
portpicker = "0.1.1"
prun = "0.1.9"
regex = "1.12.2"
tempfile = "3.24.0"
tokio-tungstenite = "0.28.0"
url = "2.5.8"
zip = "7.2.0"

[build-dependencies]
tonic-build = "0.14.3"
prost-build = "0.14.3"
tonic-prost-build = "0.14.3"

[features]
default = ["full-services"]
full-services = ["authentication", "updates", "downloader", "indexing"]
authentication = []
updates = []
downloader = []
indexing = []

[package.metadata.docs.rs]
all-features = true
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]
default-target = "x86_64-unknown-linux-gnu"
targets = [
	"x86_64-unknown-linux-gnu",
	"x86_64-apple-darwin",
	"aarch64-apple-darwin",
]
